# Конфигурация платформы (этап 2.2). Гипотезы здесь НЕ описываются — только в hypotheses/*.yaml.
# Параметры ниже — общие правила игры. Их смена после просмотра результатов = подгонка.

[data]
dir = "data"
symbols = ["ETHUSDT", "SOLUSDT", "BTCUSDT"]
btc_symbol = "BTCUSDT"
start = "2020-01"
base_url = "https://data.binance.vision/data/futures/um"
workers = 8

[availability]
oi_lag_minutes = 5
oi_max_staleness_minutes = 30

[dataset]
timeframes = ["5m", "15m"]

# Разбивка истории. [start, end). Holdout закрыт: доступ только командой test --split holdout
# с явным подтверждением, один раз на гипотезу, после пройденной валидации.
[splits]
training = ["2020-01-01", "2024-01-01"]
validation = ["2024-01-01", "2025-07-01"]
holdout = ["2025-07-01", "2100-01-01"]

[features.atr]
period = 14
pctl_window_days = 30

[features.volume]
window = 48

[features.oi]
window = 3

[features.btc]
window = 3

[features.regime]
er_window_days = 1        # efficiency ratio за сутки
er_pctl_days = 90         # тренд = ER выше своей медианы за 90 дней
btc_window_days = 1       # BTC strong/weak = знак доходности BTC за сутки
risk_ma_days = 20         # risk on/off = BTC выше/ниже своей средней за 20 дней

[costs]
taker_fee = 0.0005
slippage = 0.0002

[stats]
bootstrap = 2000
permutations = 2000
seed = 42

# Библиотека эталонов: каждая гипотеза сравнивается со всеми.
[baselines]
return_lookback = 3       # mean reversion / momentum: |close − close[−3]| ≥ 2 ATR
return_threshold_atr = 2.0

# Поиск аномалий: только на training.
[discovery]
horizons = [1, 3, 6, 12, 24]
quantile = 0.99
window_days = 30
bootstrap = 400
alpha = 0.05
min_events = 100
min_days = 30             # события должны прийтись хотя бы на 30 разных дней (дни — независимые кластеры)
controls_per_event = 5
min_delta_atr = 0.05
max_candidates = 10

# Шаблон критериев для кандидатов, найденных discovery (фиксирован до поиска).
[discovery.criteria]
split = "validation"
min_events = 300
alpha = 0.05
practical_min_delta_r = 0.05
require_positive_net = true
beat_baselines = ["random_entry", "mean_reversion", "momentum", "buy_every_sweep", "sell_every_sweep"]

# Этап 3: Information Ceiling Study. Пререгистрация — docs/stage-3-preregistration.md.
# Только training → validation. Holdout не открывается.
[ceiling]
symbols = ["ETHUSDT", "SOLUSDT"]
timeframes = ["5m", "15m"]
r_atr = [2.0, 1.0]            # 1R в ATR; первая — основная (ниже доля издержек в R)
target_r = 2.0                # цель 2R, стоп 1R → RR 1:2
horizon_bars = 48             # 5m: 4 часа; 15m: 12 часов
primary_model = "lightgbm"
models = ["lightgbm", "xgboost", "catboost", "random_forest", "hist_gb", "mlp"]
top_k = [1, 2, 3]             # лучшие сигналы в сутки
min_spacing_bars = 12         # сигналы одного дня не ближе 12 баров
inner_valid_frac = 0.2        # последние 20% training — ранняя остановка (с зазором), validation не трогается
learning_curve = [0.0625, 0.125, 0.25, 0.5, 1.0]
bootstrap = 2000
alpha = 0.05
random_features = 20
maker_cost_round_trip = 0.0004  # только справочно: лимитные вход и выход
