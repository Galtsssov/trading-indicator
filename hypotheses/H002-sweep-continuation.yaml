# Пререгистрация. После регистрации условия, критерии и clean_after менять запрещено (замок в registry.json).
id: H002
name: "Продолжение после свипа"
description: >
  После ложного пробоя (свип с закрытием обратно за уровень) цена в течение следующих 24 баров
  чаще продолжает движение в сторону выноса, чем разворачивается. Сделка — по направлению выноса:
  лонг после свипа максимума, шорт после свипа минимума.
source: >
  Побочное наблюдение отчёта reports/nif_v1/REPORT.md (раздел 5): реверсия после свипа хуже
  случайного входа во всех 6 парах монета×ТФ, MAE систематически больше MFE. Этап 1: Osler (2003, 2005) —
  пробой скопления стопов запускает каскад рыночных ордеров и продолжение.
created: 2026-10-30
# ЗАГРЯЗНЕНИЕ: наблюдение сделано на ВСЕЙ истории 2020–2026 (в агрегате), включая validation и holdout.
# Поэтому проверка на validation — слабое доказательство, а holdout для этой гипотезы — только данные
# ПОСЛЕ даты регистрации (forward). Verified возможен не раньше чем через 90 дней новых данных.
clean_after: 2026-10-30
rationale: >
  За экстремумом стоят стопы и пробойные стоп-ордера. Их исполнение — рыночные ордера по направлению
  выноса; если стопов больше, чем лимитной ликвидности, начинается каскад (Osler). Закрытие бара обратно
  за уровнем не означает исчерпания каскада: оставшиеся стопы чуть дальше и ликвидации плечевых позиций
  срабатывают на следующих барах.
event:
  type: liquidity_sweep
  params: {lookback: 24, min_age: 3, depth_atr: 0.10, cooldown: 12}
direction: with
filters: []
markets: [ETHUSDT, SOLUSDT, BTCUSDT]
timeframes: [5m, 15m]
outcome: {r_atr: 1.0, target_r: 1.0, horizon_bars: 24}
features_used:
  - "событие liquidity_sweep (уровень 24 бара, возраст ≥ 3, вынос ≥ 0.10 ATR, закрытие обратно)"
  - "atr (1R = ATR предыдущего бара)"
  - "hour, atr_pctl (подбор случайного входа)"
  - "regime_trend, regime_vol, regime_btc, regime_risk (только описательная разбивка)"
confirmation: >
  На validation (2024-01-01 — 2025-07-01) хотя бы на одном ТФ одновременно для ETHUSDT и SOLUSDT:
  ≥ 300 сделок; ожидание после издержек > 0 (нижняя граница 95% CI > 0); и превосходство над КАЖДЫМ
  эталоном (random_entry, mean_reversion, momentum, buy_every_sweep, sell_every_sweep):
  ΔE ≥ 0.05R, нижняя граница 95% CI(ΔE) > 0, p после BH < 0.05. Затем то же на forward-holdout
  (данные после 2026-10-30, не меньше 90 дней).
refutation: >
  Любой из критериев не выполнен на validation → Rejected. Разбивка по режимам и эффект до издержек
  на статус не влияют; эффект, найденный только в одном режиме, — это новая гипотеза, а не спасение этой.
statistics: >
  Основной тест разницы ожиданий выбирается по форме распределения (нормальность отвергнута →
  перестановочный, иначе Уэлч); 95% CI — блочный бутстреп по дням; поправка Бенджамини–Хохберга по всем
  сравнениям с эталонами в проверке; размер эффекта — ΔE в R и Cliff's δ. Издержки 0.14% за круг.
expectation: >
  Прогноз автора до запуска: эффект до издержек, вероятно, есть (≈ 0.05–0.13R по наблюдению nif_v1), но
  издержки (≈ 0.2–1R на сделку при 1R = 1 ATR) его перекроют → ожидаемый статус Rejected.
criteria:
  split: validation
  min_events: 300
  alpha: 0.05
  practical_min_delta_r: 0.05
  require_markets: [ETHUSDT, SOLUSDT]
  require_positive_net: true
  beat_baselines: [random_entry, mean_reversion, momentum, buy_every_sweep, sell_every_sweep]
