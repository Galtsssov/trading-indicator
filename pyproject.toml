[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlab"
version = "0.1.0"
description = "Исследовательская платформа: честная проверка торговых гипотез на данных Binance"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx", "httpx2"]   # httpx/httpx2 — тестовый клиент FastAPI (разные версии Starlette)
ceiling = ["lightgbm>=4", "xgboost>=2", "catboost>=1.2", "scikit-learn>=1.4"]
terminal = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
qlab = "qlab.cli:main"
qlab-terminal = "qlab.terminal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qlab.terminal" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
