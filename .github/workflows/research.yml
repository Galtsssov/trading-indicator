# Тесты на каждый push; исследование на реальных данных Binance — по кнопке (Actions → research → Run workflow).
# `all` = данные → качество → кэш признаков → Feature Factory (training) → проверка новых гипотез (validation).
# Holdout здесь никогда не открывается.
name: research

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "Команда qlab (all, discover, factory, pending ...)"
        default: "all"

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  study:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/cache
            !data/cache/factory_*
          key: binance-${{ github.run_id }}
          restore-keys: binance-
      - name: Данные → кэш признаков → Feature Factory → проверка гипотез
        env:
          CMD: ${{ inputs.command || 'all' }}
        run: |
          if [ "$CMD" = "all" ]; then python -m qlab all
          else python -m qlab fetch && python -m qlab cache && python -m qlab $CMD; fi
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
      - name: Закоммитить отчёт
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ hypotheses/
          git commit -m "Исследование: прогон ${{ github.run_id }}" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
