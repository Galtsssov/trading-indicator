# Тесты на каждый push; исследование на реальных данных Binance — по кнопке (Actions → research → Run workflow).
name: research

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  study:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: binance-raw-${{ github.run_id }}
          restore-keys: binance-raw-
      - name: Скачать данные, проверить качество, провести исследование
        run: python -m qlab all
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
      - name: Закоммитить отчёт
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Отчёт nif_v1: прогон ${{ github.run_id }}" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
